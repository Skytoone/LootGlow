name: LootGlow Build & Test CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Unit Tests
        run: mvn clean package --batch-mode

      - name: Upload LootGlow-Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LootGlow-Core-jar
          path: LootGlow-Core/target/LootGlow-Core-*.jar

      - name: Upload LootGlow-API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LootGlow-API-jar
          path: LootGlow-API/target/LootGlow-API-*.jar
